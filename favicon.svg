<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favFlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42D9F5"/>
      <stop offset="100%" stop-color="#26C8E8"/>
    </linearGradient>
    <linearGradient id="favBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101E32"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Tech Container -->
  <rect width="64" height="64" rx="16" fill="url(#favBgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="#23334A" stroke-width="1.5"/>

  <!-- FL Monogram Mark -->
  <g filter="url(#neonGlow)">
    <!-- Letter F -->
    <path d="M18 47V16H42" stroke="url(#favFlGrad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 30H31" stroke="url(#favFlGrad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter L -->
    <path d="M35 23V47H50" stroke="url(#favFlGrad)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Recovery Pulse Accent Node -->
    <circle cx="42" cy="16" r="2.2" fill="#FFFFFF"/>
    <circle cx="50" cy="47" r="2.2" fill="#FFFFFF"/>
  </g>
</svg>
