<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoFlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#42D9F5"/>
      <stop offset="100%" stop-color="#26C8E8"/>
    </linearGradient>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101E32"/>
      <stop offset="100%" stop-color="#080F1D"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- FL Badge Container -->
  <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#logoBgGrad)" stroke="#23334A" stroke-width="1.5"/>

  <!-- FL Monogram -->
  <g filter="url(#logoGlow)">
    <!-- Letter F -->
    <path d="M17 44V20H35" stroke="url(#logoFlGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 31H27" stroke="url(#logoFlGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Letter L -->
    <path d="M30 25V44H41" stroke="url(#logoFlGrad)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Recovery Pulse Accent Nodes -->
    <circle cx="35" cy="20" r="1.8" fill="#FFFFFF"/>
    <circle cx="41" cy="44" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark: FLUXERA -->
  <text x="64" y="36" fill="#FFFFFF" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="0.18em">FLUXERA</text>

  <!-- Subtitle / Tagline -->
  <text x="65" y="49" fill="#91A5C4" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="600" letter-spacing="0.14em">CONTINUITY &amp; RECOVERY</text>
</svg>
